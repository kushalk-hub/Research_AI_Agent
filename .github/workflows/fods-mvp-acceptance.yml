name: FODS MVP acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/fods-mvp-acceptance]

permissions:
  contents: read

jobs:
  acceptance:
    name: Fixture workflow and project checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        id: install
        run: python -m pip install -e ".[dev,tui]"

      - name: Run deterministic FODS fixture demonstration
        id: demo
        run: >-
          python -m fods.cli run
          --topic "Graph Attention Networks"
          --question "How did graph attention use local neighborhoods?"
          --output "data/fods/briefs/mvp-final-demo.md"
          --mode simulate
          --planner fixture

      - name: Validate generated brief, trace, citations, and visualization
        id: validate
        if: always() && steps.demo.outcome == 'success'
        run: >-
          python tools/validate_fods_mvp_artifacts.py
          --brief data/fods/briefs/mvp-final-demo.md
          --runs-dir data/fods/runs
          --topic "Graph Attention Networks"
          --question "How did graph attention use local neighborhoods?"

      - name: Run P4 graph-stage tests
        if: always() && steps.install.outcome == 'success'
        run: python -m pytest tests/test_p4_graph_build.py -q

      - name: Run full test suite
        if: always() && steps.install.outcome == 'success'
        run: python -m pytest tests/ -q

      - name: Run Ruff
        if: always() && steps.install.outcome == 'success'
        run: ruff check src/ tests/

      - name: Compile FODS package
        if: always() && steps.install.outcome == 'success'
        run: python -m compileall src/fods

      - name: Upload fixture acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fods-mvp-acceptance
          path: |
            data/fods/briefs/mvp-final-demo.md
            data/fods/runs/*.jsonl
            data/fods/runs/*.html
          if-no-files-found: warn
